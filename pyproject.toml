[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "proxypulse-desktop"
version = "1.0.0"
description = "Turkish desktop public proxy aggregator and health checker"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "aiohttp-socks>=0.10,<1",
]

[project.scripts]
proxypulse = "proxypulse.cli:main"

[tool.setuptools.packages.find]
include = ["proxypulse*"]

